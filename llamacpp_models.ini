# llama.cpp router model preset. Model section names are API model IDs.
# Multi-model + auto-eviction is controlled by LLAMA_ARG_MODELS_MAX in the
# .env file (NOT in this .ini — the router's built-in LRU eviction only
# kicks in when --models-max > 1, evicting the Least-Recently-Used model
# when a new one is requested and there's no free VRAM slot).
version = 1

[*]
# Conservative default suitable for retrieval, OCR, and model swapping.
ctx-size = 4096
parallel = 1
cont-batching = true
flash-attn = true
jinja = true

# Lower KV-cache memory than f16.
cache-type-k = q8_0
cache-type-v = q8_0

# Put inactive model weights/context to sleep after 5 minutes.
# Monitor VRAM: router child processes may retain CUDA/backend overhead
# even after the model is unloaded.
sleep-idle-seconds = 300
stop-timeout = 600

# =========================================================
# CHAT / INSTRUCT  (general purpose conversation & reasoning)
# =========================================================

# Primary daily-driver: fast, small-active-param MoE, good all-round quality.
[gemma-4-E4B-it-Q8_0]
model = /models/gemma-4-E4B-it-Q8_0.gguf
ctx-size = 16384
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0

# Higher-quality non-abliterated text model for difficult RAG synthesis.
[gemma-4-12b-it-Q6_K]
model = /models/gemma-4-12b-it-Q6_K.gguf
ctx-size = 12288
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0


### Uncensored and abliterated variants
[gemma-4-E4B-it-uncensored-Q8_0]
model = /models/gemma-4-E4B-it-uncensored-Q8_0.gguf
ctx-size = 16384
parallel = 1

[Gemma-4-12b-it-Abliterated.i1-Q6_K]
model = /models/Gemma-4-12b-it-Abliterated.i1-Q6_K.gguf
ctx-size = 12288
parallel = 1

[Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q8_0]
model = /models/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q8_0.gguf
ctx-size = 12288
parallel = 1

[Huihui-Qwythos-9B-Claude-Mythos-5-1M-abliterated-Q8_0]
model = /models/Huihui-Qwythos-9B-Claude-Mythos-5-1M-abliterated-Q8_0.gguf
ctx-size = 12288
parallel = 1

# heavy
[Huihui-Qwen3.6-27B-abliterated-Q2_K]
model = /models/Huihui-Qwen3.6-27B-abliterated-ggml-model-Q2_K.gguf
ctx-size = 8192
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0
no-kv-offload = true


# =========================================================
# CODE
# =========================================================
[Qwen2.5-Coder-7B-Instruct-Q5_K_M]
model = /models/Qwen2.5-Coder-7B-Instruct-Q5_K_M.gguf
ctx-size = 16384
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0

[Qwen3-Coder-30B-A3B-Instruct-UD-Q2_K_XL]
model = /models/Qwen3-Coder-30B-A3B-Instruct-UD-Q2_K_XL.gguf
ctx-size = 32768
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0
no-kv-offload = true




# =========================================================
# EMBEDDINGS  (for RAG retrieval indexing)
# =========================================================

# Tiny multilingual embedder — cheap enough to keep resident at all times.
[granite-embedding-311M-multilingual-r2-BF16]
model = /models/granite-embedding-311M-multilingual-r2-BF16.gguf
embeddings = true
ctx-size = 4096
ubatch-size = 2048
parallel = 1

# Larger, higher-quality embedder for when accuracy matters more than speed.
[Qwen3-Embedding-4B-Q6_K]
model = /models/Qwen3-Embedding-4B-Q6_K.gguf
embeddings = true
ctx-size = 4096
ubatch-size = 2048
parallel = 1
#load-on-startup = true

# =========================================================
# RERANKING  (for RAG result re-scoring)
# =========================================================

# Tiny reranker — cheap enough to keep resident at all times alongside the
# embedder above, so the core RAG loop never has to page a model in.
[qwen3-reranker-0.6b-q8_0]
model = /models/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
pooling = rank
embedding = true
ctx-size = 16384
ubatch-size = 2048
parallel = 1
#load-on-startup = true

# Larger reranker for higher-precision re-scoring on demand.
[Qwen3-Reranker-4B-q5_k_m]
model = /models/Qwen3-Reranker-4B-q5_k_m.gguf
reranking = true
pooling = rank
embedding = true
ctx-size = 16384
ubatch-size = 2048
parallel = 1


# =========================================================
# TRANSLATION
# =========================================================

[translategemma-4b-it.f16]
model = /models/translategemma-4b-it.f16.gguf
ctx-size = 8192
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0




# =========================================================
# VISION / MULTIMODAL  (model + matching mmproj required)
# =========================================================

# MiniCPM-V: low-value images, thumbnails, routine classification, or high-volume batch processing where an approximate caption is sufficient.
[MiniCPM-V-4_6-F16]
model = /models/MiniCPM-V-4_6-F16.gguf
mmproj = /models/mmproj-MiniCPM-V-4-f16.gguf
ctx-size = 16384
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0


# PRIMARY VISUAL INTERPRETER:
# Use for charts, plots, diagrams, images, figures, dashboards,
# screenshots, and semantically important visual RAG evidence.
# Do not use for routine full-page OCR.
[Qwen3VL-8B-Instruct-Q4_K_M]
model = /models/Qwen3VL-8B-Instruct-Q4_K_M.gguf
mmproj = /models/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf
ctx-size = 16384
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0

# Smallest/fastest vision-chat option for quick image Q&A.
[SmolVLM2-2.2B-Instruct-Q8_0]
model = /models/SmolVLM2-2.2B-Instruct-Q8_0.gguf
mmproj = /models/mmproj-SmolVLM2-2.2B-Instruct-Q8_0.gguf
ctx-size = 16384
# Visual grounding / "where is X in this image" localization.
[LocateAnything-3B-Q8_0]
model = /models/LocateAnything-3B-Q8_0.gguf
mmproj = /models/mmproj-LocateAnything-3B-BF16.gguf
ctx-size = 16384
parallel = 1

# Experimental Gemma-based vision fallback.
# Use only if it wins on your own document/image evaluation set;
# do not select automatically when VRAM is tight. 
[gemma-4-12b-it-Q4_0]
model = /models/gemma-4-12b-it-Q4_0.gguf
mmproj = /models/mmproj-gemma-4-12b-it-Q4-BF16.gguf
ctx-size = 16384
parallel = 1
# =========================================================
# OCR / DOCUMENT UNDERSTANDING
# =========================================================
# PRIMARY OCR / DOCUMENT PARSER:
# Use for scanned pages, forms, receipts, tables, equations,
# chart labels, legends, annotations, and dense text extraction.
[PaddleOCR-VL-1.6-GGUF]
model = /models/PaddleOCR-VL-1.6-GGUF.gguf
mmproj = /models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
ctx-size = 50192
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0


# OCR FALLBACK:
# Retry only if primary OCR fails validation, misses table/formula content,
# or produces suspiciously incomplete output.
[GLM-OCR-Q8_0]
model = /models/GLM-OCR-Q8_0.gguf
mmproj = /models/mmproj-GLM-OCR-Q8_0.gguf
ctx-size = 50192
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0

[GLM-OCR-f16]
model = /models/GLM-OCR-f16.gguf
mmproj = /models/GLM-OCR-mmproj-bf16.gguf
ctx-size = 8192
parallel = 1
flash-attn = false
cache-type-k = q8_0
cache-type-v = q8_0



# =========================================================
# SPEECH / AUDIO  (ASR + audio-chat, model + matching mmproj required)
# =========================================================

# PRIMARY ASR:
# Dedicated speech-to-text. Use for transcribing recordings, voice
# notes, and audio documents during RAG ingestion. Text output is
# short, so a small context is sufficient.
[Qwen3-ASR-1.7B-Q8_0]
model = /models/Qwen3-ASR-1.7B-Q8_0.gguf
mmproj = /models/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf
ctx-size = 16384
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0

# Higher-precision ASR variant for difficult or noisy audio,
# or when re-checking a transcription that failed validation.
[Qwen3-ASR-1.7B-bf16]
model = /models/Qwen3-ASR-1.7B-bf16.gguf
mmproj = /models/mmproj-Qwen3-ASR-1.7B-bf16.gguf
ctx-size = 16384
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0

# AUDIO-CHAT / ASR FALLBACK:
# Mistral audio model — free-form audio Q&A plus a built-in
# transcribe mode. Retry only if primary ASR output looks wrong.
[Voxtral-Mini-3B-2507-Q4_K_M]
model = /models/Voxtral-Mini-3B-2507-Q4_K_M.gguf
mmproj = /models/mmproj-Voxtral-Mini-3B-2507-Q8_0.gguf
ctx-size = 16384
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0

# Omni audio+vision chat: accepts audio and images in the same
# conversation. Use when a document has both spoken and visual parts.
[Qwen2.5-Omni-3B-Q8_0]
model = /models/Qwen2.5-Omni-3B-Q8_0.gguf
mmproj = /models/mmproj-Qwen2.5-Omni-3B-Q8_0.gguf
ctx-size = 16384
parallel = 1
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0
