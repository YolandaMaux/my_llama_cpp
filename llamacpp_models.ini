# llama.cpp router model preset. Model section names are API model IDs.
# Multi-model + auto-eviction is controlled by LLAMA_ARG_MODELS_MAX in the
# .env file (NOT in this .ini — the router's built-in LRU eviction only
# kicks in when --models-max > 1, evicting the Least-Recently-Used model
# when a new one is requested and there's no free VRAM slot).
version = 1

[*]
ctx-size = 4096
parallel = 2
cont-batching = true
flash-attn = true
jinja = true
stop-timeout = 600
# Unload any idle model after 15 min to free VRAM for the next request.
sleep-idle-seconds = 900

# =========================================================
# CHAT / INSTRUCT  (general purpose conversation & reasoning)
# =========================================================

# Primary daily-driver: fast, small-active-param MoE, good all-round quality.
[gemma-4-E4B-it-Q8_0]
model = /models/gemma-4-E4B-it-Q8_0.gguf
ctx-size = 16384
#load-on-startup = true

# Uncensored variant of the above — load on demand only.
[gemma-4-E4B-it-uncensored-Q8_0]
model = /models/gemma-4-E4B-it-uncensored-Q8_0.gguf
ctx-size = 16384

# Higher quality 12B for harder reasoning tasks (heavier VRAM).
[gemma-4-12b-it-Q6_K]
model = /models/gemma-4-12b-it-Q6_K.gguf
ctx-size = 16384

# Abliterated 12B — uncensored heavy-duty chat.
[Gemma-4-12b-it-Abliterated.i1-Q6_K]
model = /models/Gemma-4-12b-it-Abliterated.i1-Q6_K.gguf
ctx-size = 16384

# Aggressively uncensored 9B chat.
[Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q8_0]
model = /models/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q8_0.gguf
ctx-size = 16384

# Abliterated 9B — creative/roleplay-leaning chat (kept the higher-fidelity
# Q8_0 build only; the Q6_K duplicate of this same model was removed).
[Huihui-Qwythos-9B-Claude-Mythos-5-1M-abliterated-Q8_0]
model = /models/Huihui-Qwythos-9B-Claude-Mythos-5-1M-abliterated-Q8_0.gguf
ctx-size = 16384

[Huihui-Qwen3.6-27B-abliterated-Q2_K]
model = /models/Huihui-Qwen3.6-27B-abliterated-ggml-model-Q2_K.gguf
ctx-size = 16384
parallel = 1

# =========================================================
# TRANSLATION
# =========================================================

[translategemma-4b-it.f16]
model = /models/translategemma-4b-it.f16.gguf

# =========================================================
# CODE
# =========================================================
[Qwen3-Coder-30B-A3B-Instruct-UD-Q2_K_XL]
model = /models/Qwen3-Coder-30B-A3B-Instruct-UD-Q2_K_XL.gguf
ctx-size = 16384

# =========================================================
# VISION / MULTIMODAL  (model + matching mmproj required)
# =========================================================

# General vision-chat, newest MiniCPM-V build.
[MiniCPM-V-4_6-F16]
model = /models/MiniCPM-V-4_6-F16.gguf
mmproj = /models/mmproj-MiniCPM-V-4-f16.gguf
ctx-size = 16384
# General vision-chat, compact/fast option.
#[Qwen3VL-8B-Instruct-Q8_0]
#model = /models/Qwen3VL-8B-Instruct-Q8_0.gguf
#mmproj = /models/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf

[Qwen3VL-8B-Instruct-Q4_K_M]
model = /models/Qwen3VL-8B-Instruct-Q4_K_M.gguf
mmproj = /models/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf
ctx-size = 16384
load-on-startup = true

# Smallest/fastest vision-chat option for quick image Q&A.
[SmolVLM2-2.2B-Instruct-Q8_0]
model = /models/SmolVLM2-2.2B-Instruct-Q8_0.gguf
mmproj = /models/mmproj-SmolVLM2-2.2B-Instruct-Q8_0.gguf
ctx-size = 16384
# Visual grounding / "where is X in this image" localization.
[LocateAnything-3B-Q8_0]
model = /models/LocateAnything-3B-Q8_0.gguf
mmproj = /models/mmproj-LocateAnything-3B-BF16.gguf
ctx-size = 16384

# Lightweight 12B fallback when VRAM is tight for vision model. 
[gemma-4-12b-it-Q4_0]
model = /models/gemma-4-12b-it-Q4_0.gguf
mmproj = /models/mmproj-gemma-4-12b-it-Q4-BF16.gguf
ctx-size = 16384
# =========================================================
# OCR / DOCUMENT UNDERSTANDING
# =========================================================

[GLM-OCR-Q8_0]
model = /models/GLM-OCR-Q8_0.gguf
mmproj = /models/mmproj-GLM-OCR-Q8_0.gguf

[GLM-OCR-f16]
model = /models/GLM-OCR-f16.gguf
mmproj = /models/mmproj-GLM-OCR-Q8_0.gguf
flash-attn = false

[PaddleOCR-VL-1.6-GGUF]
model = /models/PaddleOCR-VL-1.6-GGUF.gguf
mmproj = /models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf

# =========================================================
# EMBEDDINGS  (for RAG retrieval indexing)
# =========================================================

# Tiny multilingual embedder — cheap enough to keep resident at all times.
[granite-embedding-311M-multilingual-r2-BF16]
model = /models/granite-embedding-311M-multilingual-r2-BF16.gguf
embeddings = true
#load-on-startup = true

# Larger, higher-quality embedder for when accuracy matters more than speed.
[Qwen3-Embedding-4B-Q6_K]
model = /models/Qwen3-Embedding-4B-Q6_K.gguf
embeddings = true

# =========================================================
# RERANKING  (for RAG result re-scoring)
# =========================================================

# Tiny reranker — cheap enough to keep resident at all times alongside the
# embedder above, so the core RAG loop never has to page a model in.
[qwen3-reranker-0.6b-q8_0]
model = /models/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
#load-on-startup = true

# Larger reranker for higher-precision re-scoring on demand.
[Qwen3-Reranker-4B-q5_k_m]
model = /models/Qwen3-Reranker-4B-q5_k_m.gguf
reranking = true
