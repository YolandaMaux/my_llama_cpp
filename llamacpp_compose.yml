services:
  llamacpp:
    container_name: llamacpp
    image: llamacpp-router:cpu
    build:
      context: .
      dockerfile: llamacpp_Dockerfile.cpu
      args:
        LLAMACPP_REF: ${LLAMACPP_REF:-master}
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    ports:
      - "${LLAMACPP_PORT:-8080}:8080"
    volumes:
      - ${MODELS_DIR:?Set MODELS_DIR in llamacpp.env}:/models:ro,Z
      - ./llamacpp_models.ini:/etc/llamacpp_models.ini:ro,Z
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_MODELS_PRESET: /etc/llamacpp_models.ini
      LLAMA_ARG_MODELS_MAX: ${LLAMA_ARG_MODELS_MAX:-1}
      LLAMA_ARG_N_GPU_LAYERS: ${LLAMA_ARG_N_GPU_LAYERS:-0}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - llm-network

networks:
  llm-network:
    name: llm-network
    driver: bridge
